name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python 3.14 checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true

      - name: Verify lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Scan tracked files for secrets
        run: git ls-files -z | xargs -0 uv run detect-secrets-hook --baseline .secrets.baseline

      - name: Check formatting and lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Check Ubuntu deployment scripts
        run: |
          bash -n deploy/bootstrap-ubuntu.sh deploy/deploy-ubuntu.sh
          bash deploy/bootstrap-ubuntu.sh --help
          bash deploy/deploy-ubuntu.sh --help

      - name: Check types
        run: uv run pyright

      - name: Run tests
        run: uv run pytest -q

      - name: Smoke-test migrations
        env:
          SHOPPING_CI_STATE_DIR: ${{ runner.temp }}/shopping-ci
          SHOPPING_CI_DATABASE: ${{ runner.temp }}/shopping-ci/shopping.sqlite3
        run: |
          install -d -m 700 "$SHOPPING_CI_STATE_DIR"
          uv run shopping migrate --database "$SHOPPING_CI_DATABASE"

      - name: Smoke-test the packaged wheel
        env:
          SHOPPING_WHEEL_DIR: ${{ runner.temp }}/dist
          SHOPPING_WHEEL_VENV: ${{ runner.temp }}/wheel-venv
          SHOPPING_WHEEL_STATE_DIR: ${{ runner.temp }}/shopping-wheel
        run: |
          install -d -m 700 "$SHOPPING_WHEEL_STATE_DIR"
          uv build --wheel --no-build-isolation --out-dir "$SHOPPING_WHEEL_DIR"
          uv venv --python 3.14 "$SHOPPING_WHEEL_VENV"
          UV_PROJECT_ENVIRONMENT="$SHOPPING_WHEEL_VENV" \
            uv sync --no-dev --no-install-project
          uv pip install --python "$SHOPPING_WHEEL_VENV/bin/python" \
            --no-deps "$SHOPPING_WHEEL_DIR"/*.whl
          uv pip check --python "$SHOPPING_WHEEL_VENV/bin/python"
          "$SHOPPING_WHEEL_VENV/bin/python" -I -c '
          from importlib.resources import files
          package = files("shopping")
          for name in ("001_ingestion.sql", "002_conversations.sql", "003_product_families.sql"):
              assert package.joinpath("storage", "migrations", name).is_file(), name
          for name in ("shopping.css", "shopping.js", "chat.js", "graph.js", "vendor/cytoscape-3.34.3.min.js", "vendor/cytoscape-3.34.3.LICENSE"):
              assert package.joinpath("web", "static", name).is_file(), name
          '
          chmod -R a-w "$SHOPPING_WHEEL_VENV"
          cd "$SHOPPING_WHEEL_STATE_DIR"
          export SHOPPING_ENV=development
          export SHOPPING_DATA_DIR="$SHOPPING_WHEEL_STATE_DIR"
          export SHOPPING_APP_ORIGIN=http://127.0.0.1:8000
          "$SHOPPING_WHEEL_VENV/bin/shopping" migrate \
            --database "$SHOPPING_WHEEL_STATE_DIR/shopping.sqlite3"
          "$SHOPPING_WHEEL_VENV/bin/python" -I -c '
          import os
          from pathlib import Path
          import shopping
          from shopping.config import load_settings
          from shopping.web import create_app
          from starlette.testclient import TestClient
          assert Path(shopping.__file__).resolve().is_relative_to(
              Path(os.environ["SHOPPING_WHEEL_VENV"]).resolve()
          )
          with TestClient(create_app(load_settings()), base_url="http://127.0.0.1:8000") as client:
              response = client.get("/api/health")
              assert response.status_code == 200
              assert response.json()["database"]["schema_version"] == 3
              assert client.get("/").status_code == 200
              graph_page = client.get("/graph")
              assert graph_page.status_code == 200
              assert "/static/vendor/cytoscape-3.34.3.min.js" in graph_page.text
              assert client.get("/graph/view").status_code == 200
              assert client.get("/graph/token", headers={"X-Graph-Page": "1"}).status_code == 200
              for name in ("shopping.css", "shopping.js", "chat.js", "graph.js", "vendor/cytoscape-3.34.3.min.js"):
                  asset = client.get(f"/static/{name}")
                  assert asset.status_code == 200 and asset.content, name
          '

      - name: Verify checks leave the repository clean
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
